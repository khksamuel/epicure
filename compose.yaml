services:
  model-service:
    build:
      context: services/model-service
    restart: unless-stopped
    volumes:
      - huggingface-cache:/home/epicure/.cache/huggingface
    environment:
      EPICURE_MODEL_COOC: ${EPICURE_MODEL_COOC:-Kaikaku/epicure-cooc}
      EPICURE_MODEL_CORE: ${EPICURE_MODEL_CORE:-Kaikaku/epicure-core}
      EPICURE_MODEL_CHEM: ${EPICURE_MODEL_CHEM:-Kaikaku/epicure-chem}
      EPICURE_MODEL_COOC_REVISION: ${EPICURE_MODEL_COOC_REVISION:-}
      EPICURE_MODEL_CORE_REVISION: ${EPICURE_MODEL_CORE_REVISION:-}
      EPICURE_MODEL_CHEM_REVISION: ${EPICURE_MODEL_CHEM_REVISION:-}
      HF_TOKEN: ${HF_TOKEN:-}

  api:
    build:
      context: services/api
    restart: unless-stopped
    depends_on:
      model-service:
        condition: service_healthy
    environment:
      EPICURE_MODEL_SERVICE_BASE_URL: http://model-service:8000

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"

  test-model-service:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./services/model-service:/workspace
    command: >
      sh -lc "python -m pip install -r requirements.lock &&
      python -m pip install --no-deps -e . &&
      python -m ruff check src tests &&
      python -m ruff format --check src tests &&
      python -m pytest -m 'not network'"
    profiles: ["test"]

  test-api:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./services/api:/workspace
    command: ["bash", "-lc", "./mvnw test"]
    profiles: ["test"]

  test-frontend:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    command: >
      sh -lc "npm ci --no-audit --no-fund &&
      npm run format:check &&
      npm run lint &&
      npm run test:coverage &&
      npm run build"
    profiles: ["test"]

volumes:
  huggingface-cache:
