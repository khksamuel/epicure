spring:
  application:
    name: epicure-api

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

epicure:
  model-service:
    base-url: ${EPICURE_MODEL_SERVICE_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${EPICURE_MODEL_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${EPICURE_MODEL_SERVICE_READ_TIMEOUT:30s}
  web:
    allowed-origins: ${EPICURE_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
