spring:
  application:
    name: epicure-api

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      # Spring/Tomcat defaults to 200 worker threads. The API is primarily a
      # thin proxy to the model service, so a small pool avoids idle thread
      # stacks on cloud instances and can be raised without rebuilding.
      max: ${SERVER_TOMCAT_MAX_THREADS:16}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:1}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:128}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:32}

epicure:
  model-service:
    base-url: ${EPICURE_MODEL_SERVICE_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${EPICURE_MODEL_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${EPICURE_MODEL_SERVICE_READ_TIMEOUT:30s}
  web:
    allowed-origins: ${EPICURE_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
