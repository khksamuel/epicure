[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "epicure-platform-backend"
version = "0.1.0"
description = "Epicure-compatible ingredient embedding loader and API backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.27,<2",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "safetensors>=0.5,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
]
dev = [
  "httpx>=0.28,<1",
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
epicure-api = "epicure_backend.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epicure", "src/epicure_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: downloads and validates the released Hugging Face models",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
