name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/model-service/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and check Python service
        working-directory: services/model-service
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pytest -m "not network"

      - name: Test Spring API
        working-directory: services/api
        run: ./mvnw test

      - name: Check React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run test:coverage
          npm run build

      - name: Upload coverage reports to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api/target/site/jacoco/jacoco.xml,frontend/coverage/lcov.info
          fail_ci_if_error: true
